type: "object"
additionalProperties: false
required:
  - "page_id"
  - "app_id"
  - "graph_api_version"
properties:
  page_id:
    type: "string"
    pattern: "^[0-9]+$"
    maxLength: 64
    title: "Facebook Page ID"
  app_id:
    type: "string"
    pattern: "^[0-9]+$"
    maxLength: 64
    title: "Meta app ID"
  graph_api_version:
    type: "string"
    pattern: "^v[0-9]+\\.[0-9]+$"
    maxLength: 16
    title: "Graph API version"
  webhook_page_ids:
    type: "array"
    maxItems: 100
    items:
      type: "string"
      pattern: "^[0-9]+$"
      maxLength: 64
    description: "Pages allowed on this callback anchor. Omit to allow only page_id."
