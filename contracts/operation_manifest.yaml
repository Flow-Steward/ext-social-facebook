operations:
  -
    operation_id: "publish_post"
    display_name: "Publish Facebook post"
    description: "Publish Facebook post using the selected Page connection."
    operation_kind: "action"
    category: "social"
    connection_type_ids:
      - "facebook_page"
    workflow_visible: true
    inputs:
      -
        name: "connection_ref"
        value_type: "connection_ref"
        required: true
      -
        name: "text"
        value_type: "text"
        required: true
        display_name: "Text"
      -
        name: "link_url"
        value_type: "text"
        required: false
        display_name: "Link Url"
    outputs:
      -
        name: "post_id"
        value_type: "text"
    result_fields:
      - "result.post_id"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
