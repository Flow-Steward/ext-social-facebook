operations:
  -
    operation_id: "publish_post"
    display_name: "Publish a Facebook Page post"
    description: "Publish a text post as the selected Facebook Page, with an optional blog or website link; return the new post ID."
    operation_kind: "action"
    category: "social"
    connection_type_ids:
      - "facebook_page"
    workflow_visible: true
    inputs:
      -
        name: "connection_ref"
        value_type: "connection_ref"
        required: true
      -
        name: "text"
        value_type: "text"
        required: true
        display_name: "Post text"
      -
        name: "link_url"
        value_type: "text"
        required: false
        display_name: "Blog or website URL"
    outputs:
      -
        name: "post_id"
        value_type: "text"
    result_fields:
      - "result.post_id"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    operation_id: "publish_photo"
    display_name: "Publish a photo to a Facebook Page"
    description: "Publish an image from a public HTTPS URL with a caption as the selected Page; return its photo and post IDs."
    operation_kind: "action"
    category: "social"
    connection_type_ids:
      - "facebook_page"
    workflow_visible: true
    inputs:
      -
        name: "connection_ref"
        value_type: "connection_ref"
        required: true
      -
        name: "image_url"
        value_type: "text"
        required: true
        display_name: "Public image URL"
      -
        name: "text"
        value_type: "text"
        required: true
        display_name: "Photo caption"
    outputs:
      -
        name: "photo_id"
        value_type: "text"
      -
        name: "post_id"
        value_type: "text"
    result_fields:
      - "result.photo_id"
      - "result.post_id"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    operation_id: "list_posts"
    display_name: "List Facebook Page posts"
    description: "Read one page of posts from the selected Facebook Page, returning items and a cursor for the next page."
    operation_kind: "action"
    category: "social"
    connection_type_ids:
      - "facebook_page"
    workflow_visible: true
    inputs:
      -
        name: "connection_ref"
        value_type: "connection_ref"
        required: true
      -
        name: "limit"
        value_type: "integer"
        required: false
        display_name: "Maximum items per page"
      -
        name: "cursor"
        value_type: "text"
        required: false
        display_name: "Next-page cursor"
    outputs:
      -
        name: "items"
        value_type: "array"
      -
        name: "next_cursor"
        value_type: "text"
    result_fields:
      - "result.items"
      - "result.next_cursor"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    operation_id: "get_post"
    display_name: "Get a Facebook Page post"
    description: "Read a post by its ID after checking that it belongs to the selected Facebook Page."
    operation_kind: "action"
    category: "social"
    connection_type_ids:
      - "facebook_page"
    workflow_visible: true
    inputs:
      -
        name: "connection_ref"
        value_type: "connection_ref"
        required: true
      -
        name: "post_id"
        value_type: "text"
        required: true
        display_name: "Facebook post ID"
    outputs:
      -
        name: "post"
        value_type: "object"
    result_fields:
      - "result.post"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    operation_id: "list_comments"
    display_name: "List comments on a Facebook post"
    description: "Read one page of comments on a post owned by the selected Page; return comments and the next-page cursor."
    operation_kind: "action"
    category: "social"
    connection_type_ids:
      - "facebook_page"
    workflow_visible: true
    inputs:
      -
        name: "connection_ref"
        value_type: "connection_ref"
        required: true
      -
        name: "post_id"
        value_type: "text"
        required: true
        display_name: "Facebook post ID"
      -
        name: "limit"
        value_type: "integer"
        required: false
        display_name: "Maximum items per page"
      -
        name: "cursor"
        value_type: "text"
        required: false
        display_name: "Next-page cursor"
    outputs:
      -
        name: "items"
        value_type: "array"
      -
        name: "next_cursor"
        value_type: "text"
    result_fields:
      - "result.items"
      - "result.next_cursor"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    operation_id: "list_replies"
    display_name: "List replies to a Facebook comment"
    description: "Read one page of replies to a comment on the selected Page after verifying the parent post."
    operation_kind: "action"
    category: "social"
    connection_type_ids:
      - "facebook_page"
    workflow_visible: true
    inputs:
      -
        name: "connection_ref"
        value_type: "connection_ref"
        required: true
      -
        name: "comment_id"
        value_type: "text"
        required: true
        display_name: "Facebook comment ID"
      -
        name: "limit"
        value_type: "integer"
        required: false
        display_name: "Maximum items per page"
      -
        name: "cursor"
        value_type: "text"
        required: false
        display_name: "Next-page cursor"
    outputs:
      -
        name: "items"
        value_type: "array"
      -
        name: "next_cursor"
        value_type: "text"
    result_fields:
      - "result.items"
      - "result.next_cursor"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    operation_id: "reply_to_comment"
    display_name: "Reply to a Facebook Page comment"
    description: "Send a text reply as the selected Page after verifying the comment belongs to one of its posts; return the reply ID."
    operation_kind: "action"
    category: "social"
    connection_type_ids:
      - "facebook_page"
    workflow_visible: true
    inputs:
