forms:
  -
    operation_id: "publish_post"
    title: "Publish a Facebook Page post"
    fields:
      -
        name: "text"
        label: "Post text"
        widget_type: "textarea"
        required: true
      -
        name: "link_url"
        label: "Blog or website URL"
        widget_type: "text"
        required: false
  -
    operation_id: "publish_photo"
    title: "Publish a photo to a Facebook Page"
    fields:
      -
        name: "image_url"
        label: "Public image URL"
        widget_type: "text"
        required: true
      -
        name: "text"
        label: "Photo caption"
        widget_type: "textarea"
        required: true
  -
    operation_id: "list_posts"
    title: "List Facebook Page posts"
    fields:
      -
        name: "limit"
        label: "Maximum items per page"
        widget_type: "number"
        required: false
      -
        name: "cursor"
        label: "Next-page cursor"
        widget_type: "text"
        required: false
  -
    operation_id: "get_post"
    title: "Get a Facebook Page post"
    fields:
      -
        name: "post_id"
        label: "Facebook post ID"
        widget_type: "text"
        required: true
  -
    operation_id: "list_comments"
    title: "List comments on a Facebook post"
    fields:
      -
        name: "post_id"
        label: "Facebook post ID"
        widget_type: "text"
        required: true
      -
        name: "limit"
        label: "Maximum items per page"
        widget_type: "number"
        required: false
      -
        name: "cursor"
        label: "Next-page cursor"
        widget_type: "text"
        required: false
  -
    operation_id: "list_replies"
    title: "List replies to a Facebook comment"
    fields:
      -
        name: "comment_id"
        label: "Facebook comment ID"
        widget_type: "text"
        required: true
      -
        name: "limit"
        label: "Maximum items per page"
        widget_type: "number"
        required: false
      -
        name: "cursor"
        label: "Next-page cursor"
        widget_type: "text"
        required: false
  -
    operation_id: "reply_to_comment"
    title: "Reply to a Facebook Page comment"
    fields:
      -
        name: "comment_id"
        label: "Facebook comment ID"
        widget_type: "text"
        required: true
      -
        name: "text"
        label: "Reply text"
        widget_type: "textarea"
        required: true
