ext.display_name: "Facebook Pages"
ext.description: "Connect Facebook Pages to Flow Steward for social media publishing and comment management. Publish text updates, share a blog post with its link, or publish a photo with a caption. Read Page posts, retrieve comments and replies, and respond to a comment as the selected Page.\n\nUse these actions in marketing workflows to share approved articles, announce product updates, and pass customer questions to the next step. The New Facebook Page comment trigger starts a workflow when a new root comment arrives from another person. Workflow steps can prepare a response or route the conversation for human review before sending a reply.\n\nCreate a separate project connection for each Facebook Page and select the intended connection in each workflow step. Publishing requires a Page access token with the appropriate Meta permissions. Receiving comment events also requires a Meta app secret, public HTTPS callback setup and a Page subscription.\n\nThis extension covers organic Page posts and comments. Advertising campaigns, personal-profile publishing, Messenger conversations, image editing and text generation are outside its operation set. Combine it with other workflow steps to prepare content before publication."
