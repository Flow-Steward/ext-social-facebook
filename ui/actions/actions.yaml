actions:
  -
    action_id: "publish_post"
    workflow_visible: true
    title: "Publish a Facebook Page post"
    description: "Publish a text post as the selected Facebook Page, with an optional blog or website link; return the new post ID."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "text"
        type: "string"
        required: true
      -
        name: "link_url"
        type: "string"
        required: false
    result_fields:
      - "result.post_id"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "publish_photo"
    workflow_visible: true
    title: "Publish a photo to a Facebook Page"
    description: "Publish an image from a public HTTPS URL with a caption as the selected Page; return its photo and post IDs."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "image_url"
        type: "string"
        required: true
      -
        name: "text"
        type: "string"
        required: true
    result_fields:
      - "result.photo_id"
      - "result.post_id"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "list_posts"
    workflow_visible: true
    title: "List Facebook Page posts"
    description: "Read one page of posts from the selected Facebook Page, returning items and a cursor for the next page."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "limit"
        type: "integer"
        required: false
      -
        name: "cursor"
        type: "string"
        required: false
    result_fields:
      - "result.items"
      - "result.next_cursor"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "get_post"
    workflow_visible: true
    title: "Get a Facebook Page post"
    description: "Read a post by its ID after checking that it belongs to the selected Facebook Page."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "post_id"
        type: "string"
        required: true
    result_fields:
      - "result.post"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "list_comments"
    workflow_visible: true
    title: "List comments on a Facebook post"
    description: "Read one page of comments on a post owned by the selected Page; return comments and the next-page cursor."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "post_id"
        type: "string"
        required: true
      -
        name: "limit"
        type: "integer"
        required: false
      -
        name: "cursor"
        type: "string"
        required: false
    result_fields:
      - "result.items"
      - "result.next_cursor"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "list_replies"
    workflow_visible: true
    title: "List replies to a Facebook comment"
    description: "Read one page of replies to a comment on the selected Page after verifying the parent post."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "comment_id"
        type: "string"
        required: true
      -
        name: "limit"
        type: "integer"
        required: false
      -
        name: "cursor"
        type: "string"
        required: false
    result_fields:
      - "result.items"
      - "result.next_cursor"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "reply_to_comment"
    workflow_visible: true
    title: "Reply to a Facebook Page comment"
    description: "Send a text reply as the selected Page after verifying the comment belongs to one of its posts; return the reply ID."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "comment_id"
        type: "string"
        required: true
      -
        name: "text"
        type: "string"
        required: true
    result_fields:
      - "result.comment_id"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "verify_connection"
    workflow_visible: false
    title: "Verify the Facebook Page connection"
    description: "Read the configured Page identity and check its ID without publishing a post or comment."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters: []
    result_fields:
      - "result.verified"
      - "result.page_id"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "ingress_event"
    workflow_visible: false
    title: "Receive new Facebook Page comments"
    description: "Convert authenticated Page comment callbacks into new-comment workflow events for the configured Pages."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters: []
    result_fields:
      - "result.ingress_type"
    error_codes:
      - "invalid_payload"
      - "authentication_failed"
      - "not_configured"
