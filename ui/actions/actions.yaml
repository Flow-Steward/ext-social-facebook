actions:
  -
    action_id: "publish_post"
    workflow_visible: true
    title: "Publish Facebook post"
    description: "Publish Facebook post using the selected Page connection."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "text"
        type: "string"
        required: true
      -
        name: "link_url"
        type: "string"
        required: false
    result_fields:
      - "result.post_id"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
